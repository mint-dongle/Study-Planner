<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            margin: 0;
            padding: 50px 20px;
            min-height: 100vh;
            color: #1e293b;
        }

        h1 {
            text-align: center;
            font-size: 40px;
            color: #1e3a8a;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        form {
            width: 600px;
            max-width: 100%;
            margin: 0 auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 16px;
            border-left: 6px solid #4f46e5;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.08);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            font-size: 15px;
            color: #1e293b;
            background-color: #f8fafc;
            transition: 0.2s ease;
        }

        input:focus {
            border-color: #4f46e5;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background-color: #4f46e5;
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background-color: #3730a3;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(79, 70, 229, 0.25);
        }

        a {
            display: block;
            width: 600px;
            max-width: 100%;
            margin: 20px auto 0;
            padding: 10px;
            text-align: center;
            color: #3730a3;
            background-color: #e0e7ff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        a:hover {
            background-color: #c7d2fe;
            transform: translateY(-2px);
        }

        @media (max-width: 650px) {
            body {
                padding: 30px 15px;
            }

            h1 {
                font-size: 30px;
                margin-bottom: 25px;
            }

            form {
                padding: 22px;
            }

            a {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <h1>Add Task for Study</h1>

    <form method="POST">
        {% csrf_token %}
        <label>Task:</label>
        <input type="text" name="title" required>
        <br>

        <label>Subject:</label>
        <input type="text" name="subject" required>
        <br>

        <label>Deadline:</label>
        <input type="date" name="deadline" required>
        <br>

        <button type="submit">Add Task</button>

    </form>
    <br>
    <a href="">Go back to home</a>
</body>
</html>
